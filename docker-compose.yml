
services:
  app:
    build: .
    ports:
      - "8030:8000"
    volumes:
      - ./:/var/www/html
    user: "1000:1000"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    ports:
      - "3309:3306"
    environment:
      MYSQL_DATABASE: tarefas
      MYSQL_USER: paradigmas
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql

  adminer:
    image: adminer
    ports:
      - "8050:8080"
    depends_on:
      - mysql

volumes:
  mysql-data:
